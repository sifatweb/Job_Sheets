<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TTC - Contact Us</title>

    <!-- Bootstrap CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand"
               href="index.html">
                TTC
            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="about.html">
                            About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="contact.html">
                            Contact Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="faq.html">
                            FAQ
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Page Header -->
    <section class="page-header">

        <h1>Contact Us</h1>

        <p>Get in touch with TTC.</p>

    </section>


    <!-- Contact Section -->
    <section class="container py-5">

        <div class="row g-5">


            <!-- Contact Form -->
            <div class="col-md-6">

                <h2>Contact Form</h2>

                <form id="contactForm">


                    <!-- Name -->
                    <div class="mb-3">

                        <label for="name"
                               class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="example@gmail.com"
                               required>

                    </div>


                    <!-- Mobile -->
                    <div class="mb-3">

                        <label for="phone"
                               class="form-label">
                            Mobile Number
                        </label>

                        <input type="text"
                               id="phone"
                               class="form-control"
                               placeholder="11 digit number"
                               maxlength="11"
                               required>

                    </div>


                    <!-- Message -->
                    <div class="mb-3">

                        <label for="message"
                               class="form-label">
                            Message
                        </label>

                        <textarea id="message"
                                  class="form-control"
                                  rows="5"
                                  required></textarea>

                    </div>


                    <!-- Submit -->
                    <button type="submit"
                            class="btn btn-primary">

                        Submit

                    </button>

                </form>

            </div>


            <!-- Contact Information -->
            <div class="col-md-6">

                <h2>Contact Information</h2>


                <p>
                    <strong>Address:</strong><br>
                    Dhaka, Bangladesh
                </p>


                <p>
                    <strong>Email:</strong><br>
                    info@ttc.com
                </p>


                <p>
                    <strong>Phone:</strong><br>
                    01234567890
                </p>


                <!-- Google Map -->
                <div class="map-container">

                    <iframe
                        src="https://www.google.com/maps?q=Dhaka,Bangladesh&output=embed"
                        width="100%"
                        height="300"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy">
                    </iframe>

                </div>

            </div>

        </div>

    </section>


    <!-- Date and Time -->
    <div class="datetime-box">

        <strong>Current Date & Time:</strong>

        <span id="datetime"></span>

    </div>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 TTC. All Rights Reserved.</p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
