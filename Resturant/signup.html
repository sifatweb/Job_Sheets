</head>

                data-bs-target="#mainNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="mainNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="menu.html">
                        Menu
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="reservation.html">

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html#about">

                    </a>
                </li>

                <li class="nav-item">

                       href="index.html#contact">

                    <a class="nav-link active"
                       href="login.html">

                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Breadcrumb -->
<div class="container py-3">

    <nav aria-label="breadcrumb">

        <ol class="breadcrumb">

            <li class="breadcrumb-item">
                <a href="index.html">Home</a>
            </li>

            <li class="breadcrumb-item active">
                Signup
            </li>

        </ol>

    </nav>

</div>


<!-- Signup Form -->
<section class="container py-4">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center section-title mb-4">
                        Create Account
                    </h2>


                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 text-center">

                                <button type="submit"
                                        class="btn btn-danger">
                                    Sign Up
                                </button>

                            </div>

                        </div>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">
