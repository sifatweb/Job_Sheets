<!-- Reservation Form -->
<section class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center section-title">
                        Reserve a Table
                    </h2>

                    <form id="reservationForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Number of Guests
                                </label>

                                <input type="number"
                                       class="form-control"
                                       min="1"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Date
                                </label>

                                <input type="date"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Time
                                </label>

                                <input type="time"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="col-12 mb-3">

                                <label class="form-label">
                                    Special Request
                                </label>

                                <textarea class="form-control"
                                          rows="4"></textarea>

                            </div>


                            <div class="col-12 text-center">

                                <button type="submit"
                                        class="btn btn-danger">
                                    Confirm Reservation
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- Confirmation Modal -->
<div class="modal fade"
     id="reservationModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Reservation Confirmation
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Your table reservation has been submitted successfully.

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-danger"
                        data-bs-dismiss="modal">
                    OK
                </button>

            </div>

        </div>

    </div>

</div>
